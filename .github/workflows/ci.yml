name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # aisdb ships wheels only up to CPython 3.12; on newer interpreters this
      # builds it from a patched sdist (see tools/build_aisdb.py).  On 3.12 and
      # below it just installs the PyPI wheel.
      - name: Install aisdb
        run: |
          python -m pip install --upgrade pip
          python tools/build_aisdb.py

      - name: Install package + dev extras
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
